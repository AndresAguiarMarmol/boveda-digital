<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="512" height="512" rx="120" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="8" />
  <circle cx="256" cy="256" r="210" fill="none" stroke="#06b6d4" stroke-width="2" stroke-dasharray="8 8" opacity="0.4" />
  
  <!-- Escudo Central -->
  <path d="M 256 90 L 370 140 C 370 270, 256 370, 256 420 C 256 370, 142 270, 142 140 Z" 
        fill="#0f172a" stroke="url(#shieldGrad)" stroke-width="14" filter="url(#glow)" />
  
  <!-- Candado de Seguridad -->
  <rect x="206" y="240" width="100" height="80" rx="18" fill="url(#shieldGrad)" />
  <path d="M 226 240 L 226 200 C 226 180, 286 180, 286 200 L 286 240" 
        fill="none" stroke="#38bdf8" stroke-width="14" stroke-linecap="round" />
  <circle cx="256" cy="275" r="8" fill="#0f172a" />
  <line x1="256" y1="283" x2="256" y2="297" stroke="#0f172a" stroke-width="5" stroke-linecap="round" />
</svg>
